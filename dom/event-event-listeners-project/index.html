<h1>Ticket Purchase</h1>

<form id="ticketForm">

    <input type="text" id="name" placeholder="Enter your name">

    <br><br>

    <select id="ticket">
        <option value="">Select Ticket</option>
        <option value="VIP">VIP - Ksh 3000</option>
        <option value="Regular">Regular - Ksh 1500</option>
        <option value="Student">Student - Ksh 800</option>
    </select>

    <br><br>

    <button id="buyBtn">Purchase Ticket</button>

</form>

<p id="message"></p>
